<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackwater Funding Engine</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1d24">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2e38;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4fc3f7;
      --good: #66bb6a;
      --warn: #ffa726;
      --bad: #ef5350;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; }
    button, .file-label {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.secondary { background: #333; color: var(--text); }
    main { padding: 16px 20px; max-width: 900px; margin: 0 auto; }
    .section-title {
      margin: 24px 0 12px;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .score { font-weight: 700; color: var(--good); }
    .disposition {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .disposition.verified { background: #1b5e20; color: #c8e6c9; }
    .disposition.needs_review, .disposition.conflicting { background: #e65100; color: #ffe0b2; }
    .reasons { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.9rem; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Blackwater Funding Engine</h1>
      <div class="subtitle">Pass 5 Review Queue · Local-first</div>
    </div>
    <div>
      <label class="file-label">
        Load JSON
        <input type="file" id="fileInput" accept=".json" style="display:none">
      </label>
      <button id="sampleBtn" class="secondary">Load Sample</button>
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <input id="driveUrl" type="text" placeholder="Paste Google Drive share link" style="flex:1; min-width:200px; padding:8px; border-radius:6px; border:1px solid var(--border); background:#111; color:var(--text);">
        <button id="loadDriveBtn">Load from Drive</button>
      </div>
    </div>
  </header>

  <main>
    <div id="content">
      <div class="empty">Load a review-queue JSON export from the Python engine, or click “Load Sample” to see the layout.</div>
    </div>
  </main>

  <footer>Aurora / Blackwater · Local Funding Engine</footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const content = document.getElementById('content');
    const fileInput = document.getElementById('fileInput');
    const sampleBtn = document.getElementById('sampleBtn');

    function render(data) {
      // Accept either {shortlist, rejections} or a flat array of queue items
      let shortlist = [];
      let rejections = [];
      if (Array.isArray(data)) {
        shortlist = data.filter(i => i.verification_disposition === 'verified' && i.eligible);
        rejections = data.filter(i => !shortlist.includes(i));
      } else if (data && typeof data === 'object') {
        shortlist = data.shortlist || [];
        rejections = data.rejections || data.flagged || [];
      }

      let html = '';
      html += `<div class="section-title">Verified Shortlist (${shortlist.length})</div>`;
      if (shortlist.length === 0) {
        html += `<div class="card"><div class="meta">No verified matches in this export.</div></div>`;
      } else {
        shortlist.forEach(item => {
          html += cardHtml(item, true);
        });
      }

      html += `<div class="section-title">Flagged / Needs Review (${rejections.length})</div>`;
      if (rejections.length === 0) {
        html += `<div class="card"><div class="meta">No flagged items.</div></div>`;
      } else {
        rejections.forEach(item => {
          // rejections may be plain reason objects or full payloads
          const payload = item.review_queue_payload || item;
          html += cardHtml(payload, false, item.reason);
        });
      }
      content.innerHTML = html;
    }

    function cardHtml(item, isShortlist, extraReason) {
      const disp = (item.verification_disposition || 'unknown').replace('_', ' ');
      const dispClass = item.verification_disposition || 'unknown';
      const score = item.composite_score != null ? item.composite_score.toFixed(4) : '—';
      const reasons = (item.eligibility_reasons || []).concat(extraReason ? [extraReason] : []);
      const reasonsHtml = reasons.length
        ? `<ul class="reasons">${reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul>`
        : '';
      return `
        <div class="card">
          <h3>${escapeHtml(item.name || item.opportunity_id || 'Untitled')}</h3>
          <div class="meta">
            ${escapeHtml(item.funding_type || '')} · ${escapeHtml(item.provider_name || '')}
            · Score: <span class="score">${score}</span>
            · <span class="disposition ${dispClass}">${escapeHtml(disp)}</span>
          </div>
          ${item.official_url ? `<div class="meta"><a href="${escapeHtml(item.official_url)}" target="_blank" rel="noopener" style="color:var(--accent)">${escapeHtml(item.official_url)}</a></div>` : ''}
          ${item.verification_notes ? `<div class="meta">${escapeHtml(item.verification_notes)}</div>` : ''}
          ${reasonsHtml}
        </div>
      `;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          render(data);
        } catch (err) {
          content.innerHTML = `<div class="empty">Could not parse JSON: ${escapeHtml(err.message)}</div>`;
        }
      };
      reader.readAsText(file);
    });

    sampleBtn.addEventListener('click', () => {
      const sample = {
        shortlist: [
          {
            name: "Florida Gulf Coast Ecological Protection Grant",
            funding_type: "grant",
            provider_name: "Florida DEP",
            composite_score: 0.8742,
            verification_disposition: "verified",
            official_url: "https://dep.state.fl.us",
            eligibility_reasons: [],
            verification_notes: "Provenance and status checks passed."
          }
        ],
        rejections: [
          {
            reason: "Pass 4 Verification Gate Blocked Processing. State: 'conflicting'.",
            review_queue_payload: {
              name: "Federal Adaptive Infrastructure Innovation Prize",
              opportunity_id: "GRANT-CONFLICTED",
              funding_type: "prize",
              provider_name: "FEMA",
              composite_score: 0.0,
              verification_disposition: "conflicting",
              official_url: "https://fema.gov",
              verification_notes: "Deadlocked status claims with equal weight: ['open', 'closed']",
              eligibility_reasons: []
            }
          }
        ]
      };
      render(sample);
    });

    document.getElementById('loadDriveBtn').addEventListener('click', async () => {
      const raw = document.getElementById('driveUrl').value.trim();
      if (!raw) {
        content.innerHTML = '<div class="empty">Paste a Google Drive share link first.</div>';
        return;
      }
      // Convert common Drive share URLs to direct download
      let fileId = null;
      const m1 = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      const m2 = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m1) fileId = m1[1];
      else if (m2) fileId = m2[1];
      if (!fileId) {
        content.innerHTML = '<div class="empty">Could not find a file ID in that link.</div>';
        return;
      }
      const direct = `https://drive.google.com/uc?export=download&id=${fileId}`;
      content.innerHTML = '<div class="empty">Loading from Drive…</div>';
      try {
        const res = await fetch(direct);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const data = JSON.parse(text);
        render(data);
      } catch (err) {
        content.innerHTML = `<div class="empty">Failed to load from Drive: ${escapeHtml(err.message)}<br>Make sure the file is shared as “Anyone with the link can view”.</div>`;
      }
    });
  </script>
</body>
</html>
